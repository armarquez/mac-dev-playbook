---
homebrew_installed_packages:
  - autoconf
  - bash-completion
  - gettext
  - sqlite
  - ssh-copy-id
  - readline
  - pv
  - wget
  - wrk
  - tailscale

homebrew_cask_apps:
  - firefox
  - licecap

# Exercises tasks/tailscale.yml's real `brew services start tailscale` on
# real macOS CI runners, without enrolling a real device on the tailnet --
# tailscale_manage_service: false skips the actual `tailscale up` call.
# See docs/beast-onboarding-plan.md in boogey/infra for the full context.
configure_tailscale: true
tailscale_manage_service: false
tailscale_authkey: "test-fake-key-not-a-real-secret"

# dotfiles_repo (default.config.yml) points at a private personal repo CI
# has no access to -- pre-existing gap, unrelated to Tailscale, but it was
# aborting the whole integration run before tasks/tailscale.yml ever got a
# chance to execute. Disabling it here is scoped to the test fixture only;
# does not change beast's real provisioning behavior.
configure_dotfiles: false
